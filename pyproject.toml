[project]
name = "molecule"
version = "0.0.0"
description = "A chemical reaction puzzle game."
requires-python = ">=3.12"
dependencies = [
  "pyglet==2.1.12",
  "pymunk==7.1.0",
  "fastapi==0.115.8",
  "uvicorn==0.33.0",
  "numpy==1.26.4",
  "Pillow==12.1.1",
  "pycairo==1.26.1",
  "xmlschema==3.4.3",
]

[project.optional-dependencies]
cmleditor = [
  "PyGObject==3.48.2",
  "rdkit==2024.3.5",
  "openbabel-wheel",
  "requests==2.32.4",
  "beautifulsoup4==4.13.3",
]

[dependency-groups]
dev = [
  "mypy",
]

[tool.uv]
exclude-newer = "14 days"

[tool.mypy]
python_version = "3.12"
files = [
  "start.py",
  "cml2img.py",
  "libcml",
  "libreact",
  "molecule",
  "cmleditor",
  "utils",
]
exclude = "(^tests/|(^|/)test_.*\\.py$|(^|/)cmleditor\\.py$|rdkit-stubs/)"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
disable_error_code = [
  "var-annotated",
  "attr-defined",
  "override",
  "name-defined",
  "arg-type",
  "union-attr",
]

[[tool.mypy.overrides]]
module = [
  "pyglet",
  "pyglet.*",
  "pymunk",
  "pymunk.*",
  "uvicorn",
  "fastapi",
  "fastapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "gi",
  "gi.*",
  "requests",
  "requests.*",
  "bs4",
  "bs4.*",
  "PIL",
  "PIL.*",
  "cairo",
  "numpy",
  "rdkit",
  "rdkit.*",
  "objgraph",
]
ignore_missing_imports = true
