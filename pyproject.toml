[tool.mypy]
python_version = "3.12"
files = [
  "libreact",
  "libcml/CachedCml.py",
  "molecule/server",
  "molecule/emitters/Emitters.py",
  "start.py",
  "cml2img.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
  "pyglet",
  "pyglet.*",
  "pymunk",
  "pymunk.*",
  "uvicorn",
  "fastapi",
  "fastapi.*",
]
ignore_missing_imports = true
